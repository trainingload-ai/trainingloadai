name: Feature request
description: Propose an improvement to the public Trainingload.ai project.
title: "[Feature] "
body:
  - type: markdown
    attributes:
      value: |
        Describe the user problem before proposing an implementation. Large architecture, schema, or lifecycle changes should be discussed with maintainers before code is written.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What cannot be done today, and who encounters this problem?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe the observable behavior that would solve the problem.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Activity import or analysis
        - Training metrics
        - Training plans or calendar
        - AI coach
        - Self-host operations
        - Maps
        - Documentation
        - Localization or accessibility
        - Developer experience
        - Other
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Explain current workarounds or simpler approaches you considered.
  - type: textarea
    id: public_scope
    attributes:
      label: Public project fit
      description: Explain why this belongs in the open-source Self-host product rather than a hosted billing, subscription, operations, or private-provider feature.
    validations:
      required: true
  - type: checkboxes
    id: terms
    attributes:
      label: Submission checklist
      options:
        - label: I searched existing issues and did not find the same request.
          required: true
        - label: This request does not contain credentials, private data, or athlete records.
          required: true
