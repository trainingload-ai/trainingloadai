name: Self-host 支持
description: 报告可重现的 self-host 安装、运行、备份、恢复、升级或诊断问题。
title: "[Self-host] "
labels:
  - self-host
body:
  - type: markdown
    attributes:
      value: |
        不要粘贴 `.env.selfhost`、密码、token、cookie、私钥、数据库 dump、uploads 或完整连接串。请先运行 `self-host doctor --json`。Diagnostics 工件仍可能包含 hostname 或日志业务数据：必须先在本机人工检查，并且只通过维护者指定的私密渠道上传。
  - type: input
    id: release
    attributes:
      label: Self-host 版本
      description: 填写 `self-host --version` 输出或精确 release tag。
      placeholder: 1.1.15
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: 宿主平台
      description: 填写 OS、版本、架构、Docker Engine 与 Docker Compose 版本。
      placeholder: Ubuntu 24.04, x86_64, Docker 27.5.1, Compose 2.32.4
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Runtime mode
      options:
        - core-local
        - connected
        - extended
        - unknown / 无法启动
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Doctor 发现
      description: 只列出 fail/warning check code 与 error code，不要粘贴配置值或原始日志。
      placeholder: SELF_HOST_DOCTOR_DOCKER_ENGINE -> SELF_HOST_DOCKER_UNAVAILABLE
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 重现步骤
      description: 提供最短可重复步骤，包括管理 CLI 命令和 exit code。
      placeholder: |
        1. 执行 ...
        2. 观察到 exit ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true
  - type: input
    id: bundle_hash
    attributes:
      label: Diagnostics SHA-256（可选）
      description: 只填写 CLI 输出的 hash。除非维护者明确要求通过私密渠道提供，否则不要公开附加工件。
  - type: textarea
    id: recent_changes
    attributes:
      label: 最近变更
      description: 说明升级、恢复、网络/代理变化、磁盘压力、权限变化或宿主重启，不要包含 secret 值。
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我没有包含 secret、token、cookie、私钥、`.env.selfhost`、数据库 dump、uploads 或完整连接串。
          required: true
        - label: 我已在本机人工检查 diagnostics 工件，并理解自动脱敏不等于匿名性保证。
          required: true
