version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 10
    groups:
      npm-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:15"
      timezone: Asia/Shanghai
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: /apps/client
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
      timezone: Asia/Shanghai

  - package-ecosystem: docker
    directory: /apps/server
    schedule:
      interval: weekly
      day: monday
      time: "09:45"
      timezone: Asia/Shanghai

  - package-ecosystem: docker
    directory: /packages/prisma
    schedule:
      interval: weekly
      day: monday
      time: "10:00"
      timezone: Asia/Shanghai
