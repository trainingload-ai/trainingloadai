name: Self-host documentation contract

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"
  push:
    paths:
      - ".github/workflows/selfhost-docs.yml"
      - "SELF_HOSTING.md"
      - "SELF_HOST_OPERATIONS.md"
      - "SELF_HOST_KNOWN_LIMITATIONS.md"
      - "BACKUP_RESTORE.md"
      - "UPGRADE.md"
      - "ai_docs/self-hosting/**"
      - "docker/selfhost/documentation-contract.json"
      - ".github/ISSUE_TEMPLATE/self-host-support.yml"
      - "docker/selfhost/release-bundle-contract.json"
      - "scripts/selfhost/**"
      - "package.json"
      - "pnpm-lock.yaml"

permissions:
  contents: read

env:
  NODE_VERSION: 22.23.3

jobs:
  validate-docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the documentation revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the contracted Node.js runtime
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install exact validation dependencies
        run: |
          corepack enable
          corepack prepare pnpm@9.0.0 --activate
          pnpm install --frozen-lockfile

      - name: Execute documented command contracts
        run: |
          pnpm selfhost:inventory:check
          pnpm selfhost:docs-contract
          node --test scripts/selfhost/verify-selfhost-documentation.test.mjs scripts/selfhost/install-core.test.mjs scripts/selfhost/management-core.test.mjs

  wrapper-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Check out the documentation revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the contracted Node.js runtime
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install exact wrapper dependencies
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@9.0.0 --activate
          pnpm install --frozen-lockfile

      - name: Execute POSIX release entrypoints
        if: ${{ runner.os != 'Windows' }}
        shell: bash
        run: |
          set -euo pipefail
          ./install.sh --help
          ./self-host --help

      - name: Execute PowerShell release entrypoints
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          .\install.ps1 --help
          .\self-host.ps1 --help
