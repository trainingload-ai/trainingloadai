name: Publish Docs image

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-image-publish
  cancel-in-progress: false

jobs:
  source:
    runs-on: ubuntu-24.04
    steps:
      - name: Require the reviewed canonical main branch
        run: |
          test "$GITHUB_REPOSITORY" = trainingload-ai/trainingloadai
          test "$GITHUB_REF" = refs/heads/main

  build:
    needs: source
    uses: ./.github/workflows/docs.yml
    with:
      image-artifact: true

  publish:
    needs: build
    if: github.repository == 'trainingload-ai/trainingloadai' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: 22.23.3
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: docs-image-${{ github.sha }}
          path: dist/docs-image
      - name: Verify the same-run image archive and source binding
        id: artifact
        run: node scripts/docs/image-artifact.mjs verify
      - name: Load the image that passed the Docs checks and smoke test
        run: |
          docker load -i dist/docs-image/image.tar
          docker image inspect '${{ steps.artifact.outputs.image_id }}' > dist/docs-image/inspect.json
          node scripts/docs/image-artifact.mjs check-image
      - uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push the tested image without recompilation
        id: release
        run: |
          docker tag '${{ steps.artifact.outputs.image_id }}' '${{ steps.artifact.outputs.tag }}'
          docker push '${{ steps.artifact.outputs.tag }}'
          docker image inspect '${{ steps.artifact.outputs.tag }}' > dist/docs-image/published-inspect.json
          node scripts/docs/image-artifact.mjs release
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6
      - name: Sign and verify the image and release record
        env:
          REFERENCE: ${{ steps.release.outputs.reference }}
          SIGNATURE_IDENTITY: https://github.com/trainingload-ai/trainingloadai/.github/workflows/docs-image.yml@refs/heads/main
        run: |
          cosign sign --yes "$REFERENCE"
          cosign verify --certificate-identity "$SIGNATURE_IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com "$REFERENCE" \
            > dist/docs-image/image-signature.json
          cosign attest --yes --type https://trainingload.ai/docs-image/v1 \
            --predicate dist/docs-image/docs-release.json "$REFERENCE"
          cosign verify-attestation --type https://trainingload.ai/docs-image/v1 \
            --certificate-identity "$SIGNATURE_IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com "$REFERENCE" \
            > dist/docs-image/release-attestation.json
          cosign sign-blob --yes --bundle dist/docs-image/docs-release.bundle.json dist/docs-image/docs-release.json
          cosign verify-blob --bundle dist/docs-image/docs-release.bundle.json \
            --certificate-identity "$SIGNATURE_IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com dist/docs-image/docs-release.json
          printf '### Published Docs image\n\n`%s`\n\nDownload the signed Docs release record from this run.\n' "$REFERENCE" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: docs-release-${{ github.sha }}
          path: |
            dist/docs-image/docs-release.json
            dist/docs-image/docs-release.bundle.json
            dist/docs-image/image-signature.json
            dist/docs-image/release-attestation.json
          if-no-files-found: error
          retention-days: 90
