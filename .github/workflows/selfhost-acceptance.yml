name: Self-host release acceptance

on:
  workflow_dispatch:
    inputs:
      release_run_id:
        description: "Run ID that produced the current signed release artifact"
        required: true
        type: string
      release_revision:
        description: "Exact 40-character source revision for the current release"
        required: true
        type: string
      release_version:
        description: "Exact semantic version for the current release"
        required: true
        type: string
      previous_release_run_id:
        description: "Run ID that produced the previous signed release artifact"
        required: true
        type: string
      previous_release_revision:
        description: "Exact 40-character source revision for the previous release"
        required: true
        type: string
      previous_release_version:
        description: "Exact semantic version for the previous release"
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: selfhost-acceptance-${{ inputs.release_revision }}
  cancel-in-progress: false

env:
  NODE_VERSION: 22.23.3

jobs:
  validate-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Require the exact release tag and revision
        env:
          RELEASE_REVISION: ${{ inputs.release_revision }}
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          test "$GITHUB_SHA" = "$RELEASE_REVISION"
          test "$GITHUB_REF" = "refs/tags/v$RELEASE_VERSION"

      - name: Check out the workflow revision for contract validation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up the contracted Node.js runtime
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install exact test dependencies
        run: |
          corepack enable
          corepack prepare pnpm@9.0.0 --activate
          pnpm install --frozen-lockfile

      - name: Validate acceptance contracts and unit evidence
        run: |
          node scripts/selfhost/verify-acceptance-workflow.mjs
          node scripts/selfhost/verify-compose-contract.mjs
          node scripts/selfhost/verify-image-workflow.mjs
          node --test scripts/selfhost/*.test.mjs

  acceptance:
    needs: validate-contract
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: ubuntu-amd64-core-local
            platform_id: ubuntu-amd64
            mode: core-local
            runner: '["ubuntu-24.04"]'
          - id: ubuntu-amd64-connected
            platform_id: ubuntu-amd64
            mode: connected
            runner: '["ubuntu-24.04"]'
          - id: linux-arm64-core-local
            platform_id: linux-arm64
            mode: core-local
            runner: '["ubuntu-24.04-arm"]'
          - id: linux-arm64-connected
            platform_id: linux-arm64
            mode: connected
            runner: '["ubuntu-24.04-arm"]'
          - id: macos-apple-silicon-core-local
            platform_id: macos-apple-silicon
            mode: core-local
            runner: '["self-hosted","macOS","ARM64","selfhost-acceptance","docker-desktop"]'
          - id: macos-apple-silicon-connected
            platform_id: macos-apple-silicon
            mode: connected
            runner: '["self-hosted","macOS","ARM64","selfhost-acceptance","docker-desktop"]'
          - id: windows-11-wsl2-core-local
            platform_id: windows-11-wsl2
            mode: core-local
            runner: '["self-hosted","windows","x64","selfhost-acceptance","docker-desktop","wsl2"]'
          - id: windows-11-wsl2-connected
            platform_id: windows-11-wsl2
            mode: connected
            runner: '["self-hosted","windows","x64","selfhost-acceptance","docker-desktop","wsl2"]'
    runs-on: ${{ fromJSON(matrix.runner) }}
    steps:
      - name: Set up the contracted Node.js runtime
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install the pinned signing client
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6

      - name: Download the exact current signed release
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: trainingload-selfhost-release-${{ inputs.release_revision }}
          path: ${{ runner.temp }}/selfhost-acceptance-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.id }}/current
          run-id: ${{ inputs.release_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download the exact previous signed release
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: trainingload-selfhost-release-${{ inputs.previous_release_revision }}
          path: ${{ runner.temp }}/selfhost-acceptance-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.id }}/previous
          run-id: ${{ inputs.previous_release_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Authenticate artifacts before executing release code
        env:
          ACCEPTANCE_ARTIFACT_ROOT: ${{ runner.temp }}/selfhost-acceptance-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.id }}
          CURRENT_VERSION: ${{ inputs.release_version }}
          CURRENT_REVISION: ${{ inputs.release_revision }}
          PREVIOUS_VERSION: ${{ inputs.previous_release_version }}
          PREVIOUS_REVISION: ${{ inputs.previous_release_revision }}
        run: >-
          node -e '
          const crypto = require("node:crypto");
          const child = require("node:child_process");
          const fs = require("node:fs");
          const path = require("node:path");
          const semver = /^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/;
          const revision = /^[a-f0-9]{40}$/;
          const maxMetadata = 16 * 1024 * 1024;
          function regular(file, maximum = maxMetadata) {
            const stat = fs.lstatSync(file);
            if (!stat.isFile() || stat.isSymbolicLink() || stat.size <= 0 || stat.size > maximum) throw new Error("unsafe or oversized release artifact");
            return stat;
          }
          function sameFile(left, right) {
            return left.dev === right.dev && left.ino === right.ino && left.size === right.size && left.mtimeMs === right.mtimeMs && left.ctimeMs === right.ctimeMs;
          }
          function readStable(file, maximum = maxMetadata) {
            const before = regular(file, maximum);
            const descriptor = fs.openSync(file, "r");
            try {
              const opened = fs.fstatSync(descriptor);
              if (!opened.isFile() || !sameFile(before, opened)) throw new Error("release artifact changed before reading");
              const contents = fs.readFileSync(descriptor);
              const after = fs.fstatSync(descriptor);
              if (contents.length !== opened.size || !sameFile(opened, after)) throw new Error("release artifact changed while reading");
              return contents;
            } finally {
              fs.closeSync(descriptor);
            }
          }
          function sha256File(file, maximum) {
            const before = regular(file, maximum);
            const hash = crypto.createHash("sha256");
            const descriptor = fs.openSync(file, "r");
            const buffer = Buffer.allocUnsafe(1024 * 1024);
            try {
              const opened = fs.fstatSync(descriptor);
              if (!opened.isFile() || !sameFile(before, opened)) throw new Error("release artifact changed before hashing");
              let size = 0;
              let bytesRead;
              do {
                bytesRead = fs.readSync(descriptor, buffer, 0, buffer.length, null);
                if (bytesRead > 0) {
                  hash.update(buffer.subarray(0, bytesRead));
                  size += bytesRead;
                }
              } while (bytesRead > 0);
              const after = fs.fstatSync(descriptor);
              if (size !== opened.size || !sameFile(opened, after)) throw new Error("release artifact changed while hashing");
            } finally {
              fs.closeSync(descriptor);
            }
            return hash.digest("hex");
          }
          const specifications = [
            ["current", process.env.CURRENT_VERSION, process.env.CURRENT_REVISION],
            ["previous", process.env.PREVIOUS_VERSION, process.env.PREVIOUS_REVISION],
          ];
          for (const [name, version, sourceRevision] of specifications) {
            if (!semver.test(version) || !revision.test(sourceRevision)) {
              throw new Error(name + " release identity input is invalid");
            }
            const directory = path.resolve(process.env.ACCEPTANCE_ARTIFACT_ROOT, name);
            const bundle = "trainingload-selfhost-" + version;
            const archive = path.resolve(directory, bundle + ".tar.gz");
            const checksum = archive + ".sha256";
            const signature = checksum + ".bundle.json";
            regular(archive, 4 * 1024 * 1024 * 1024);
            regular(checksum);
            regular(signature);
            const checksumContents = readStable(checksum);
            const checksumText = checksumContents.toString("utf8");
            const match = checksumText.match(/^([a-f0-9]{64})  ([A-Za-z0-9._-]+)\r?\n?$/);
            if (!match || match[2] !== path.basename(archive)) throw new Error("invalid archive checksum inventory");
            const identity = "https://github.com/trainingload-ai/trainingloadai/.github/workflows/selfhost-images.yml@refs/tags/v" + version;
            const verified = child.spawnSync("cosign", [
              "verify-blob", "--bundle", signature,
              "--certificate-identity", identity,
              "--certificate-oidc-issuer", "https://token.actions.githubusercontent.com",
              checksum,
            ], { stdio: "inherit", windowsHide: true });
            if (verified.error || verified.status !== 0) throw new Error("archive signature verification failed");
            if (!readStable(checksum).equals(checksumContents)) throw new Error("archive checksum changed during signature verification");
            if (sha256File(archive, 4 * 1024 * 1024 * 1024) !== match[1]) throw new Error("archive checksum mismatch");
            const listing = child.spawnSync("tar", ["-tzf", archive], { encoding: "utf8", windowsHide: true });
            if (listing.error || listing.status !== 0) throw new Error("archive inventory could not be read");
            const entries = listing.stdout.split(/\r?\n/).filter(Boolean);
            if (!entries.length || entries.length > 10000) throw new Error("release archive inventory is invalid");
            for (const entry of entries) {
              const canonical = entry.replace(/\/+$/, "");
              const unsafeSegment = canonical.split("/").some((part) => !/^[A-Za-z0-9._-]+$/.test(part) || part === "." || part === ".." || part.includes(":") || /[. ]$/.test(part) || /^(?:con|prn|aux|nul|com[1-9]|lpt[1-9])(?:\.|$)/i.test(part));
              if (entry.includes("\\") || entry.startsWith("/") || unsafeSegment || !(canonical === bundle || canonical.startsWith(bundle + "/"))) {
                throw new Error("archive path escaped its release prefix");
              }
            }
            const verbose = child.spawnSync("tar", ["-tvzf", archive], { encoding: "utf8", windowsHide: true });
            const verboseEntries = verbose.stdout?.split(/\r?\n/).filter(Boolean) ?? [];
            if (verbose.error || verbose.status !== 0 || verboseEntries.length !== entries.length || verboseEntries.some((entry) => !["-", "d"].includes(entry[0]))) throw new Error("release archive contains a link or special file");
            const manifestResult = child.spawnSync("tar", ["-xOzf", archive, bundle + "/release-manifest.json"], { encoding: "utf8", windowsHide: true });
            if (manifestResult.error || manifestResult.status !== 0) throw new Error("signed release manifest could not be read");
            const manifest = JSON.parse(manifestResult.stdout);
            if (manifest.releaseVersion !== version || manifest.source?.revision !== sourceRevision) {
              throw new Error("signed artifact does not bind the requested source revision");
            }
            if (sha256File(archive, 4 * 1024 * 1024 * 1024) !== match[1]) throw new Error("release archive changed while inspecting it");
          }
          '

      - name: Check out the authenticated release revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_revision }}
          persist-credentials: false

      - name: Verify and extract the current release
        run: node scripts/selfhost/prepare-acceptance-release.mjs --artifact-directory "${{ runner.temp }}/selfhost-acceptance-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.id }}/current" --output-directory "${{ runner.temp }}/selfhost-acceptance-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.id }}/working/current" --version "${{ inputs.release_version }}" --revision "${{ inputs.release_revision }}" --record "${{ runner.temp }}/selfhost-acceptance-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.id }}/working/current.json" --json

      - name: Verify and extract the previous release
        run: node scripts/selfhost/prepare-acceptance-release.mjs --artifact-directory "${{ runner.temp }}/selfhost-acceptance-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.id }}/previous" --output-directory "${{ runner.temp }}/selfhost-acceptance-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.id }}/working/previous" --version "${{ inputs.previous_release_version }}" --revision "${{ inputs.previous_release_revision }}" --record "${{ runner.temp }}/selfhost-acceptance-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.id }}/working/previous.json" --json

      - name: Run the fail-closed platform and mode acceptance suite
        run: node scripts/selfhost/run-acceptance.mjs --run-id "${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.id }}" --platform-id "${{ matrix.platform_id }}" --mode "${{ matrix.mode }}" --release-directory "${{ runner.temp }}/selfhost-acceptance-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.id }}/working/current/trainingload-selfhost-${{ inputs.release_version }}" --release-preparation "${{ runner.temp }}/selfhost-acceptance-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.id }}/working/current.json" --previous-release-directory "${{ runner.temp }}/selfhost-acceptance-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.id }}/working/previous/trainingload-selfhost-${{ inputs.previous_release_version }}" --previous-release-preparation "${{ runner.temp }}/selfhost-acceptance-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.id }}/working/previous.json" --evidence-directory "${{ runner.temp }}/selfhost-acceptance-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.id }}/evidence"

      - name: Upload immutable acceptance evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: selfhost-acceptance-${{ matrix.id }}
          path: ${{ runner.temp }}/selfhost-acceptance-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.id }}/evidence
          if-no-files-found: error
          retention-days: 90

      - name: Remove test-owned downloaded artifacts
        if: ${{ always() }}
        env:
          ACCEPTANCE_ARTIFACT_ROOT: ${{ runner.temp }}/selfhost-acceptance-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.id }}
          ACCEPTANCE_RUN_PREFIX: selfhost-acceptance-${{ github.run_id }}-${{ github.run_attempt }}-
        run: >-
          node -e '
          const fs = require("node:fs");
          const path = require("node:path");
          const root = path.resolve(process.env.ACCEPTANCE_ARTIFACT_ROOT);
          const temporaryRoot = path.resolve(process.env.RUNNER_TEMP);
          if (path.dirname(root) !== temporaryRoot || !path.basename(root).startsWith(process.env.ACCEPTANCE_RUN_PREFIX)) {
            throw new Error("refusing to remove an unowned acceptance path");
          }
          fs.rmSync(root, { recursive: true, force: true });
          '

  finalize-acceptance:
    needs: acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - name: Check out the authenticated release revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_revision }}
          persist-credentials: false

      - name: Set up the contracted Node.js runtime
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install exact finalization dependencies
        run: |
          corepack enable
          corepack prepare pnpm@9.0.0 --activate
          pnpm install --frozen-lockfile

      - name: Install the pinned signing client
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6

      - name: Download all matrix evidence without merging cells
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: selfhost-acceptance-*
          path: dist/acceptance-matrix
          merge-multiple: false

      - name: Finalize the complete fail-closed matrix
        run: node scripts/selfhost/finalize-acceptance.mjs --input-directory dist/acceptance-matrix --output-directory dist/acceptance-gate --run-id "${{ github.run_id }}-${{ github.run_attempt }}" --workflow-revision "${{ github.sha }}" --workflow-ref "${{ github.workflow_ref }}" --current-version "${{ inputs.release_version }}" --current-revision "${{ inputs.release_revision }}" --previous-version "${{ inputs.previous_release_version }}" --previous-revision "${{ inputs.previous_release_revision }}"

      - name: Sign the aggregate acceptance checksums
        run: cosign sign-blob --yes --bundle dist/acceptance-gate/acceptance-checksums.bundle.json dist/acceptance-gate/acceptance-checksums.txt

      - name: Verify the aggregate acceptance signature
        run: cosign verify-blob --bundle dist/acceptance-gate/acceptance-checksums.bundle.json --certificate-identity "https://github.com/${GITHUB_WORKFLOW_REF}" --certificate-oidc-issuer "https://token.actions.githubusercontent.com" dist/acceptance-gate/acceptance-checksums.txt

      - name: Upload the signed aggregate acceptance gate
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: selfhost-acceptance-gate-${{ inputs.release_revision }}
          path: dist/acceptance-gate
          if-no-files-found: error
          retention-days: 90
