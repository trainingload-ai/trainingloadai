name: Self-host image supply chain

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish signed multi-architecture images after all smoke tests pass"
        required: true
        type: boolean
        default: false

concurrency:
  group: selfhost-images-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  NODE_VERSION: 22.23.3
  LEAK_CANARY: TRAININGLOAD_LAYER_LEAK_CANARY_${{ github.run_id }}_${{ github.run_attempt }}

jobs:
  validate-contracts:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the contracted Node.js runtime
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install exact test dependencies
        run: |
          corepack enable
          corepack prepare pnpm@9.0.0 --activate
          pnpm install --frozen-lockfile

      - name: Validate image and supply-chain contracts
        run: |
          node scripts/selfhost/verify-image-contract.mjs
          node scripts/selfhost/verify-image-workflow.mjs
          node --test scripts/selfhost/*.test.mjs

  smoke-source-images:
    needs: validate-contracts
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        role: [migrate, server, client]
        platform:
          - target: linux/amd64
            arch: amd64
          - target: linux/arm64
            arch: arm64
    steps:
      - name: Check out source without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the contracted Node.js runtime
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: amd64,arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Derive reproducible release metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          created="$(git show -s --format=%cI "$GITHUB_SHA")"
          epoch="$(git show -s --format=%ct "$GITHUB_SHA")"
          source="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          image="trainingload-selfhost-smoke/${{ matrix.role }}:$GITHUB_SHA-${{ matrix.platform.arch }}"
          case "${{ matrix.role }}" in
            migrate) dockerfile="packages/prisma/Dockerfile" ;;
            server) dockerfile="apps/server/Dockerfile" ;;
            client) dockerfile="apps/client/Dockerfile" ;;
          esac
          {
            echo "version=$version"
            echo "created=$created"
            echo "epoch=$epoch"
            echo "source=$source"
            echo "image=$image"
            echo "dockerfile=$dockerfile"
            echo "build_args<<EOF"
            echo "RELEASE_VERSION=$version"
            echo "SOURCE_REVISION=$GITHUB_SHA"
            echo "SOURCE_URL=$source"
            echo "BUILD_DATE=$created"
            echo "SOURCE_DATE_EPOCH=$epoch"
            echo "SELF_HOST_SCHEMA_VERSION=1"
            if [[ "${{ matrix.role }}" == "client" ]]; then
              echo "NEXT_BUILD_CPUS=1"
              echo "NEXT_BUILD_MAX_OLD_SPACE_MB=2048"
              echo "NEXT_PUBLIC_API_URL=http://localhost:3001"
              echo "NEXT_PUBLIC_BASE_URL=http://localhost:3002"
              echo "NEXT_PUBLIC_APP_URL=http://localhost:3002"
              echo "NEXT_PUBLIC_DEMO_HOST=disabled.invalid"
              echo "NEXT_PUBLIC_DOCS_URL=http://localhost:3000"
              echo "NEXT_PUBLIC_MARKETING_BASE_URL=http://localhost:3002"
              echo "NEXT_PUBLIC_AUTH_UI_ENABLED=true"
              echo "NEXT_PUBLIC_ENABLE_APPLE_SIGN_IN=false"
              echo "NEXT_PUBLIC_ENABLE_AI_CREDIT_GRANT_TEST=false"
              echo "SELF_HOST_MODE_MARKER=core-local"
              echo "SELF_HOST_TELEMETRY_ENABLED=false"
              echo "AI_TODAY_WEATHER_ENABLED=false"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Seed excluded files with a leak canary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .aws uploads data backups
          printf '%s\n' "$LEAK_CANARY" > .env
          printf '%s\n' "$LEAK_CANARY" > .aws/credentials
          printf '%s\n' "$LEAK_CANARY" > uploads/private.fit
          printf '%s\n' "$LEAK_CANARY" > data/private.db
          printf '%s\n' "$LEAK_CANARY" > backups/private.dump

      - name: Build one source platform for local verification
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ steps.meta.outputs.dockerfile }}
          platforms: ${{ matrix.platform.target }}
          load: true
          push: false
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.image }}
          build-args: ${{ steps.meta.outputs.build_args }}
          cache-from: type=gha,scope=selfhost-${{ matrix.role }}-${{ matrix.platform.arch }}
          cache-to: type=gha,mode=max,scope=selfhost-${{ matrix.role }}-${{ matrix.platform.arch }}

      - name: Run the source-image smoke contract
        run: |
          node scripts/selfhost/smoke-image.mjs \
            --image "${{ steps.meta.outputs.image }}" \
            --role "${{ matrix.role }}" \
            --platform "${{ matrix.platform.target }}" \
            --version "${{ steps.meta.outputs.version }}" \
            --revision "$GITHUB_SHA" \
            --source "${{ steps.meta.outputs.source }}"

      - name: Scan every source-image layer for excluded material
        run: |
          node scripts/selfhost/scan-image-layers.mjs \
            --image "${{ steps.meta.outputs.image }}" \
            --forbid-value "$LEAK_CANARY"

  publish-candidates:
    needs: smoke-source-images
    if: ${{ inputs.publish }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        role: [migrate, server, client]
    steps:
      - name: Check out source without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the contracted Node.js runtime
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: amd64,arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install the pinned Cosign release
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6

      - name: Derive reproducible release metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          expected_ref="refs/tags/v$version"
          if [[ "$GITHUB_REF" != "$expected_ref" ]]; then
            echo "Publishing requires $expected_ref; current ref is $GITHUB_REF" >&2
            exit 1
          fi
          created="$(git show -s --format=%cI "$GITHUB_SHA")"
          epoch="$(git show -s --format=%ct "$GITHUB_SHA")"
          source="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          repository="$REGISTRY/${GITHUB_REPOSITORY,,}/trainingload-${{ matrix.role }}"
          candidate="$repository:candidate-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          signature_identity="$source/.github/workflows/selfhost-images.yml@$GITHUB_REF"
          case "${{ matrix.role }}" in
            migrate) dockerfile="packages/prisma/Dockerfile" ;;
            server) dockerfile="apps/server/Dockerfile" ;;
            client) dockerfile="apps/client/Dockerfile" ;;
          esac
          {
            echo "version=$version"
            echo "created=$created"
            echo "epoch=$epoch"
            echo "source=$source"
            echo "repository=$repository"
            echo "candidate=$candidate"
            echo "signature_identity=$signature_identity"
            echo "dockerfile=$dockerfile"
            echo "build_args<<EOF"
            echo "RELEASE_VERSION=$version"
            echo "SOURCE_REVISION=$GITHUB_SHA"
            echo "SOURCE_URL=$source"
            echo "BUILD_DATE=$created"
            echo "SOURCE_DATE_EPOCH=$epoch"
            echo "SELF_HOST_SCHEMA_VERSION=1"
            if [[ "${{ matrix.role }}" == "client" ]]; then
              echo "NEXT_BUILD_CPUS=1"
              echo "NEXT_BUILD_MAX_OLD_SPACE_MB=2048"
              echo "NEXT_PUBLIC_API_URL=http://localhost:3001"
              echo "NEXT_PUBLIC_BASE_URL=http://localhost:3002"
              echo "NEXT_PUBLIC_APP_URL=http://localhost:3002"
              echo "NEXT_PUBLIC_DEMO_HOST=disabled.invalid"
              echo "NEXT_PUBLIC_DOCS_URL=http://localhost:3000"
              echo "NEXT_PUBLIC_MARKETING_BASE_URL=http://localhost:3002"
              echo "NEXT_PUBLIC_AUTH_UI_ENABLED=true"
              echo "NEXT_PUBLIC_ENABLE_APPLE_SIGN_IN=false"
              echo "NEXT_PUBLIC_ENABLE_AI_CREDIT_GRANT_TEST=false"
              echo "AI_TODAY_WEATHER_ENABLED=false"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Seed excluded files with a leak canary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .aws uploads data backups
          printf '%s\n' "$LEAK_CANARY" > .env
          printf '%s\n' "$LEAK_CANARY" > .aws/credentials
          printf '%s\n' "$LEAK_CANARY" > uploads/private.fit
          printf '%s\n' "$LEAK_CANARY" > data/private.db
          printf '%s\n' "$LEAK_CANARY" > backups/private.dump

      - name: Build and push the signed-evidence candidate
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ steps.meta.outputs.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.meta.outputs.candidate }}
          build-args: ${{ steps.meta.outputs.build_args }}
          cache-from: type=gha,scope=selfhost-publish-${{ matrix.role }}
          cache-to: type=gha,mode=max,scope=selfhost-publish-${{ matrix.role }}

      - name: Sign and verify the exact image-index digest
        shell: bash
        run: |
          set -euo pipefail
          reference="${{ steps.meta.outputs.repository }}@${{ steps.build.outputs.digest }}"
          cosign sign --yes "$reference"
          mkdir -p dist/selfhost-images
          cosign verify \
            --certificate-identity "${{ steps.meta.outputs.signature_identity }}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$reference" > "dist/selfhost-images/${{ matrix.role }}.signature.json"

      - name: Extract and validate attached SBOM and provenance
        shell: bash
        run: |
          set -euo pipefail
          reference="${{ steps.meta.outputs.repository }}@${{ steps.build.outputs.digest }}"
          docker buildx imagetools inspect "$reference" --raw \
            > "dist/selfhost-images/${{ matrix.role }}.index.json"
          docker buildx imagetools inspect "$reference" --format '{{json .SBOM}}' \
            > "dist/selfhost-images/${{ matrix.role }}.sbom.json"
          docker buildx imagetools inspect "$reference" --format '{{json .Provenance}}' \
            > "dist/selfhost-images/${{ matrix.role }}.provenance.json"
          node scripts/selfhost/verify-published-evidence.mjs \
            --role "${{ matrix.role }}" \
            --image "${{ steps.meta.outputs.repository }}" \
            --digest "${{ steps.build.outputs.digest }}" \
            --manifest "dist/selfhost-images/${{ matrix.role }}.index.json" \
            --sbom "dist/selfhost-images/${{ matrix.role }}.sbom.json" \
            --provenance "dist/selfhost-images/${{ matrix.role }}.provenance.json" \
            --signature "dist/selfhost-images/${{ matrix.role }}.signature.json" \
            --signature-identity "${{ steps.meta.outputs.signature_identity }}" \
            --output "dist/selfhost-images/${{ matrix.role }}.result.json"

      - name: Pull by digest and rerun the same smoke suite on both platforms
        shell: bash
        run: |
          set -euo pipefail
          reference="${{ steps.meta.outputs.repository }}@${{ steps.build.outputs.digest }}"
          while read -r platform arch; do
            local_image="trainingload-selfhost-prebuilt/${{ matrix.role }}:$arch"
            docker pull --platform "$platform" "$reference"
            docker image tag "$reference" "$local_image"
            node scripts/selfhost/smoke-image.mjs \
              --image "$local_image" \
              --role "${{ matrix.role }}" \
              --platform "$platform" \
              --version "${{ steps.meta.outputs.version }}" \
              --revision "$GITHUB_SHA" \
              --source "${{ steps.meta.outputs.source }}"
            node scripts/selfhost/scan-image-layers.mjs \
              --image "$local_image" \
              --forbid-value "$LEAK_CANARY"
          done <<'PLATFORMS'
          linux/amd64 amd64
          linux/arm64 arm64
          PLATFORMS

      - name: Upload immutable image evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: selfhost-image-${{ matrix.role }}
          path: dist/selfhost-images
          if-no-files-found: error
          retention-days: 30

  vulnerability-scan:
    needs: publish-candidates
    if: ${{ inputs.publish }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        role: [migrate, server, client]
        platform:
          - target: linux/amd64
            arch: amd64
          - target: linux/arm64
            arch: arm64
    steps:
      - name: Download the signed image evidence without checking out source
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: selfhost-image-${{ matrix.role }}
          path: dist/selfhost-image

      - name: Install the pinned signature verifier
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6

      - name: Resolve and authenticate the exact image digest
        id: image
        shell: bash
        run: |
          set -euo pipefail
          result="dist/selfhost-image/${{ matrix.role }}.result.json"
          reference="$(jq -er '.reference' "$result")"
          expected_identity="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/.github/workflows/selfhost-images.yml@$GITHUB_REF"
          [[ "$reference" =~ ^ghcr\.io/buerber/trainingloadai/trainingload-${{ matrix.role }}@sha256:[a-f0-9]{64}$ ]]
          cosign verify \
            --certificate-identity "$expected_identity" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$reference" > /dev/null
          mkdir -p dist/selfhost-vulnerability
          echo "reference=$reference" >> "$GITHUB_OUTPUT"

      - name: Log in read-only to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Reject fixable critical or high vulnerabilities
        uses: docker/scout-action@a4119c5a8c5076236a54e4ce99531f7e4dd2ef84 # v1.27.0
        with:
          command: cves
          image: registry://${{ steps.image.outputs.reference }}
          platform: ${{ matrix.platform.target }}
          only-severities: critical,high
          only-fixed: true
          exit-code: true
          sarif-file: dist/selfhost-vulnerability/${{ matrix.role }}-${{ matrix.platform.arch }}.sarif.json
          summary: false
          write-comment: false
          registry-user: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}

      - name: Require the vulnerability evidence file
        shell: bash
        run: |
          set -euo pipefail
          test -s "dist/selfhost-vulnerability/${{ matrix.role }}-${{ matrix.platform.arch }}.sarif.json"

      - name: Upload immutable vulnerability evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: selfhost-vulnerability-${{ matrix.role }}-${{ matrix.platform.arch }}
          path: dist/selfhost-vulnerability/${{ matrix.role }}-${{ matrix.platform.arch }}.sarif.json
          if-no-files-found: error
          retention-days: 90

  finalize-release:
    needs: [publish-candidates, vulnerability-scan]
    if: ${{ inputs.publish }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Check out source without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the contracted Node.js runtime
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Install the pinned signing client
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download verified per-image evidence
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: selfhost-image-*
          path: dist/selfhost-images
          merge-multiple: true

      - name: Download platform vulnerability evidence
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: selfhost-vulnerability-*
          path: dist/selfhost-images/vulnerability
          merge-multiple: true

      - name: Validate and bind complete vulnerability evidence
        shell: bash
        run: |
          set -euo pipefail
          node scripts/selfhost/vulnerability-evidence.mjs \
            --directory dist/selfhost-images \
            --result dist/selfhost-images/migrate.result.json \
            --result dist/selfhost-images/server.result.json \
            --result dist/selfhost-images/client.result.json \
            --output dist/selfhost-images/vulnerability-result.json

      - name: Create the digest-bound release manifest
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          created="$(git show -s --format=%cI "$GITHUB_SHA")"
          source="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          node scripts/selfhost/create-image-release-manifest.mjs \
            --version "$version" \
            --revision "$GITHUB_SHA" \
            --source "$source" \
            --created "$created" \
            --result dist/selfhost-images/migrate.result.json \
            --result dist/selfhost-images/server.result.json \
            --result dist/selfhost-images/client.result.json \
            --vulnerability-result dist/selfhost-images/vulnerability-result.json \
            --output dist/selfhost-images/release-manifest.json \
            --digests-output dist/selfhost-images/image-digests.txt

      - name: Promote verified digests to immutable release tags
        run: node scripts/selfhost/promote-image-release.mjs dist/selfhost-images/release-manifest.json

      - name: Assemble the complete self-host release bundle
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          node scripts/selfhost/build-selfhost-release.mjs \
            dist/selfhost-images \
            "dist/trainingload-selfhost-$version"

      - name: Checksum all release evidence
        run: node scripts/selfhost/create-checksums.mjs dist/selfhost-images

      - name: Sign and verify the complete release evidence inventory
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          identity="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/.github/workflows/selfhost-images.yml@refs/tags/v$version"
          cosign sign-blob --yes \
            --bundle dist/selfhost-images/checksums.bundle.json \
            dist/selfhost-images/checksums.txt
          cosign verify-blob \
            --bundle dist/selfhost-images/checksums.bundle.json \
            --certificate-identity "$identity" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            dist/selfhost-images/checksums.txt

      - name: Sign and verify the installable release bundle
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          bundle="dist/trainingload-selfhost-$version"
          identity="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/.github/workflows/selfhost-images.yml@refs/tags/v$version"
          cosign sign-blob --yes \
            --bundle "$bundle/checksums.bundle.json" \
            "$bundle/checksums.txt"
          chmod 0644 "$bundle/checksums.txt" "$bundle/checksums.bundle.json"
          cosign verify-blob \
            --bundle "$bundle/checksums.bundle.json" \
            --certificate-identity "$identity" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$bundle/checksums.txt"

      - name: Execute the bundled installer dry-run
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          "dist/trainingload-selfhost-$version/install.sh" --dry-run --json

      - name: Create the reproducible release archive
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          bundle="trainingload-selfhost-$version"
          epoch="$(git show -s --format=%ct "$GITHUB_SHA")"
          for output in "dist/$bundle.tar.gz" "dist/$bundle.repro.tar.gz"; do
            tar \
              --sort=name \
              --format=posix \
              --pax-option=delete=atime,delete=ctime \
              --mtime="@$epoch" \
              --owner=0 \
              --group=0 \
              --numeric-owner \
              -cf - \
              -C dist \
              "$bundle" | gzip -n > "$output"
          done
          cmp "dist/$bundle.tar.gz" "dist/$bundle.repro.tar.gz"
          rm "dist/$bundle.repro.tar.gz"
          (cd dist && sha256sum "$bundle.tar.gz" > "$bundle.tar.gz.sha256")

      - name: Sign and verify the release archive before distribution
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          bundle="trainingload-selfhost-$version"
          identity="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/.github/workflows/selfhost-images.yml@refs/tags/v$version"
          cosign sign-blob --yes \
            --bundle "dist/$bundle.tar.gz.sha256.bundle.json" \
            "dist/$bundle.tar.gz.sha256"
          cosign verify-blob \
            --bundle "dist/$bundle.tar.gz.sha256.bundle.json" \
            --certificate-identity "$identity" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "dist/$bundle.tar.gz.sha256"

      - name: Upload the installable self-host release
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trainingload-selfhost-release-${{ github.sha }}
          path: |
            dist/trainingload-selfhost-*/
            dist/trainingload-selfhost-*.tar.gz
            dist/trainingload-selfhost-*.tar.gz.sha256
            dist/trainingload-selfhost-*.tar.gz.sha256.bundle.json
          if-no-files-found: error
          retention-days: 90

      - name: Upload release evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trainingload-selfhost-images-${{ github.sha }}
          path: dist/selfhost-images
          if-no-files-found: error
          retention-days: 90

      - name: Write the immutable release receipt
        shell: bash
        run: |
          {
            echo "## Self-host image release"
            echo
            sed 's/^/    /' dist/selfhost-images/image-digests.txt
          } >> "$GITHUB_STEP_SUMMARY"
