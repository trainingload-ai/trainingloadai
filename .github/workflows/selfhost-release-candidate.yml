name: Self-host v1 release candidate

on:
  workflow_dispatch:
    inputs:
      candidate_id:
        description: "Monotonic candidate identifier such as rc.1"
        required: true
        type: string
      release_run_id:
        description: "Run ID that produced the exact signed release artifact"
        required: true
        type: string
      release_version:
        description: "Exact semantic version of the candidate release"
        required: true
        type: string
      release_revision:
        description: "Exact 40-character revision of the candidate release"
        required: true
        type: string
      acceptance_run_id:
        description: "Run ID that produced the complete signed acceptance gate"
        required: true
        type: string
      acceptance_run_attempt:
        description: "Run attempt embedded in the signed acceptance manifest"
        required: true
        type: string
      release_attestation_base64:
        description: "Base64 of a schema-valid release attestation; it must contain no secrets or user data"
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: selfhost-rc-${{ inputs.release_revision }}-${{ inputs.candidate_id }}
  cancel-in-progress: false

env:
  NODE_VERSION: 22.23.3

jobs:
  promote-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - name: Require the exact release tag, revision, and explicit attestations
        shell: bash
        env:
          CANDIDATE_ID: ${{ inputs.candidate_id }}
          RELEASE_VERSION: ${{ inputs.release_version }}
          RELEASE_REVISION: ${{ inputs.release_revision }}
          ACCEPTANCE_RUN_ATTEMPT: ${{ inputs.acceptance_run_attempt }}
          RELEASE_ATTESTATION_BASE64: ${{ inputs.release_attestation_base64 }}
          ATTESTATION_PATH: ${{ runner.temp }}/selfhost-rc-${{ github.run_id }}-${{ github.run_attempt }}/release-attestation.input.json
        run: |
          set -euo pipefail
          test "$GITHUB_SHA" = "$RELEASE_REVISION"
          test "$GITHUB_REF" = "refs/tags/v$RELEASE_VERSION"
          [[ "$CANDIDATE_ID" =~ ^rc\.[1-9][0-9]*$ ]]
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          [[ "$RELEASE_REVISION" =~ ^[a-f0-9]{40}$ ]]
          [[ "$ACCEPTANCE_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          node <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");
          const encoded = process.env.RELEASE_ATTESTATION_BASE64 || "";
          if (!encoded || encoded.length > 100000 || encoded.length % 4 !== 0 || !/^[A-Za-z0-9+/]+={0,2}$/.test(encoded)) {
            throw new Error("release attestation is not bounded canonical base64");
          }
          const bytes = Buffer.from(encoded, "base64");
          if (bytes.length === 0 || bytes.length > 65536 || bytes.toString("base64") !== encoded) {
            throw new Error("release attestation base64 is not canonical");
          }
          const value = JSON.parse(bytes.toString("utf8"));
          const cleanRoom = value.codexCleanRoom || {};
          const issue = value.issueReview || {};
          const requiredTrue = [
            "cleanTarget",
            "installerDryRunPassed",
            "installationCompleted",
            "deploymentReady",
            "ownerBootstrapPerformedByOperator",
            "coreUserJourneyPassed",
            "containerRecreatePassed",
            "hostRestartPassed",
            "postRestartDataVerified",
            "diagnosticsReviewed",
          ];
          if (
            value.schemaVersion !== 1 ||
            value.kind !== "trainingload-selfhost-release-attestation" ||
            value.release?.version !== process.env.RELEASE_VERSION ||
            value.release?.revision !== process.env.RELEASE_REVISION ||
            cleanRoom.status !== "passed" ||
            cleanRoom.agent !== "codex" ||
            cleanRoom.contractSource !== "signed-release-bundle-only" ||
            cleanRoom.secretScan !== "pass" ||
            requiredTrue.some((name) => cleanRoom[name] !== true) ||
            issue.status !== "passed" ||
            issue.knownLimitationsReviewed !== true ||
            issue.unresolvedP0 !== 0 ||
            issue.unresolvedP1 !== 0 ||
            issue.releaseBlockers !== 0
          ) {
            throw new Error("release attestation does not contain every required passing claim");
          }
          const destination = path.resolve(process.env.ATTESTATION_PATH);
          fs.mkdirSync(path.dirname(destination), { recursive: true, mode: 0o700 });
          fs.writeFileSync(destination, bytes, { flag: "wx", mode: 0o600 });
          NODE

      - name: Set up the contracted Node.js runtime
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install the pinned signing client
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6

      - name: Download the exact signed release
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: trainingload-selfhost-release-${{ inputs.release_revision }}
          path: ${{ runner.temp }}/selfhost-rc-${{ github.run_id }}-${{ github.run_attempt }}/release
          run-id: ${{ inputs.release_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download the exact signed aggregate acceptance gate
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: selfhost-acceptance-gate-${{ inputs.release_revision }}
          path: ${{ runner.temp }}/selfhost-rc-${{ github.run_id }}-${{ github.run_attempt }}/acceptance
          run-id: ${{ inputs.acceptance_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Authenticate inputs before checkout
        shell: bash
        env:
          RC_ROOT: ${{ runner.temp }}/selfhost-rc-${{ github.run_id }}-${{ github.run_attempt }}
          RELEASE_VERSION: ${{ inputs.release_version }}
          RELEASE_REVISION: ${{ inputs.release_revision }}
          ACCEPTANCE_RUN_ID: ${{ inputs.acceptance_run_id }}
          ACCEPTANCE_RUN_ATTEMPT: ${{ inputs.acceptance_run_attempt }}
          ATTESTATION_PATH: ${{ runner.temp }}/selfhost-rc-${{ github.run_id }}-${{ github.run_attempt }}/release-attestation.input.json
        run: |
          set -euo pipefail
          node <<'NODE'
          const child = require("node:child_process");
          const crypto = require("node:crypto");
          const fs = require("node:fs");
          const path = require("node:path");

          const root = path.resolve(process.env.RC_ROOT);
          const version = process.env.RELEASE_VERSION;
          const revision = process.env.RELEASE_REVISION;
          const acceptanceRunId = process.env.ACCEPTANCE_RUN_ID;
          const acceptanceRunAttempt = process.env.ACCEPTANCE_RUN_ATTEMPT;
          const issuer = "https://token.actions.githubusercontent.com";
          const repository = "https://github.com/Buerber/trainingloadai";
          const maxMetadata = 16 * 1024 * 1024;
          const maxAcceptance = 64 * 1024 * 1024;
          const portable = /^[A-Za-z0-9._-]+(?:\/[A-Za-z0-9._-]+)*$/;

          function fail(message) { throw new Error(message); }
          function regular(file, maximum = maxMetadata) {
            const stat = fs.lstatSync(file);
            if (!stat.isFile() || stat.isSymbolicLink() || stat.size <= 0 || stat.size > maximum) fail("unsafe evidence file: " + file);
            return stat;
          }
          function sameFile(left, right) {
            return left.dev === right.dev && left.ino === right.ino && left.size === right.size && left.mtimeMs === right.mtimeMs && left.ctimeMs === right.ctimeMs;
          }
          function readStable(file, maximum = maxMetadata) {
            const before = regular(file, maximum);
            const descriptor = fs.openSync(file, "r");
            try {
              const opened = fs.fstatSync(descriptor);
              if (!opened.isFile() || !sameFile(before, opened)) fail("evidence changed before reading: " + file);
              const contents = fs.readFileSync(descriptor);
              const after = fs.fstatSync(descriptor);
              if (contents.length !== opened.size || !sameFile(opened, after)) fail("evidence changed while reading: " + file);
              return contents;
            } finally {
              fs.closeSync(descriptor);
            }
          }
          async function sha256(file, maximum) {
            const before = regular(file, maximum);
            const handle = await fs.promises.open(file, "r");
            try {
              const opened = await handle.stat();
              if (!opened.isFile() || !sameFile(before, opened)) fail("evidence changed before hashing: " + file);
              const hash = crypto.createHash("sha256");
              let size = 0;
              for await (const chunk of handle.createReadStream({ autoClose: false })) {
                hash.update(chunk);
                size += chunk.length;
              }
              const after = await handle.stat();
              if (size !== opened.size || !sameFile(opened, after)) fail("evidence changed while hashing: " + file);
              return hash.digest("hex");
            } finally {
              await handle.close();
            }
          }
          function verify(payload, bundle, workflow) {
            const identity = repository + workflow + "@refs/tags/v" + version;
            const result = child.spawnSync("cosign", [
              "verify-blob", "--bundle", bundle,
              "--certificate-identity", identity,
              "--certificate-oidc-issuer", issuer,
              payload,
            ], { stdio: "inherit", windowsHide: true });
            if (result.error || result.status !== 0) fail("signature verification failed for " + payload);
          }
          function walk(directory, prefix = "") {
            const files = [];
            for (const entry of fs.readdirSync(directory, { withFileTypes: true }).sort((a, b) => a.name.localeCompare(b.name))) {
              const absolute = path.resolve(directory, entry.name);
              const relative = prefix ? prefix + "/" + entry.name : entry.name;
              const stat = fs.lstatSync(absolute);
              if (stat.isSymbolicLink()) fail("evidence contains a symlink: " + relative);
              if (stat.isDirectory()) files.push(...walk(absolute, relative));
              else if (stat.isFile()) files.push({ absolute, relative, size: stat.size });
              else fail("evidence contains a special file: " + relative);
            }
            return files;
          }

          (async () => {
            const release = path.resolve(root, "release");
            const bundleName = "trainingload-selfhost-" + version;
            const archive = path.resolve(release, bundleName + ".tar.gz");
            const archiveChecksum = archive + ".sha256";
            const archiveSignature = archiveChecksum + ".bundle.json";
            regular(archive, 4 * 1024 * 1024 * 1024);
            regular(archiveChecksum);
            regular(archiveSignature);
            const archiveChecksumContents = readStable(archiveChecksum);
            const checksumMatch = archiveChecksumContents.toString("utf8").match(/^([a-f0-9]{64})  ([A-Za-z0-9._-]+)\r?\n?$/);
            if (!checksumMatch || checksumMatch[2] !== path.basename(archive)) fail("release checksum inventory is invalid");
            verify(archiveChecksum, archiveSignature, "/.github/workflows/selfhost-images.yml");
            if (!readStable(archiveChecksum).equals(archiveChecksumContents)) fail("release checksum changed during verification");
            if (await sha256(archive, 4 * 1024 * 1024 * 1024) !== checksumMatch[1]) fail("release archive checksum mismatch");
            const listing = child.spawnSync("tar", ["-tzf", archive], { encoding: "utf8", windowsHide: true });
            if (listing.error || listing.status !== 0) fail("release archive listing failed");
            const entries = listing.stdout.split(/\r?\n/).filter(Boolean);
            if (!entries.length || entries.length > 10000) fail("release archive inventory is invalid");
            const seen = new Set();
            for (const entry of entries) {
              const canonical = entry.replace(/\/+$/, "");
              if (entry.includes("\\") || entry.startsWith("/") || canonical.split("/").some((part) => !/^[A-Za-z0-9._-]+$/.test(part) || part === "." || part === ".." || part.includes(":") || /[. ]$/.test(part) || /^(?:con|prn|aux|nul|com[1-9]|lpt[1-9])(?:\.|$)/i.test(part)) || seen.has(canonical) || !(canonical === bundleName || canonical.startsWith(bundleName + "/"))) fail("unsafe release archive path: " + entry);
              seen.add(canonical);
            }
            const verbose = child.spawnSync("tar", ["-tvzf", archive], { encoding: "utf8", windowsHide: true });
            if (verbose.error || verbose.status !== 0 || verbose.stdout.split(/\r?\n/).filter(Boolean).length !== entries.length || verbose.stdout.split(/\r?\n/).filter(Boolean).some((entry) => !["-", "d"].includes(entry[0]))) fail("release archive contains a link or special file");
            const manifestResult = child.spawnSync("tar", ["-xOzf", archive, bundleName + "/release-manifest.json"], { encoding: "utf8", windowsHide: true });
            if (manifestResult.error || manifestResult.status !== 0) fail("release manifest could not be streamed");
            const releaseManifest = JSON.parse(manifestResult.stdout);
            if (releaseManifest.releaseVersion !== version || releaseManifest.source?.revision !== revision) fail("release identity mismatch");
            if (await sha256(archive, 4 * 1024 * 1024 * 1024) !== checksumMatch[1]) fail("release archive changed while inspecting it");
            const attestationPath = path.resolve(process.env.ATTESTATION_PATH);
            regular(attestationPath);
            const attestation = JSON.parse(readStable(attestationPath).toString("utf8"));
            if (
              attestation.release?.version !== version ||
              attestation.release?.revision !== revision ||
              attestation.release?.archiveSha256 !== checksumMatch[1] ||
              attestation.codexCleanRoom?.hostRestartPassed !== true ||
              attestation.codexCleanRoom?.postRestartDataVerified !== true ||
              attestation.issueReview?.unresolvedP0 !== 0 ||
              attestation.issueReview?.unresolvedP1 !== 0 ||
              attestation.issueReview?.releaseBlockers !== 0
            ) fail("release attestation is incomplete or bound to another release");

            const acceptance = path.resolve(root, "acceptance");
            const acceptanceChecksums = path.resolve(acceptance, "acceptance-checksums.txt");
            const acceptanceSignature = path.resolve(acceptance, "acceptance-checksums.bundle.json");
            regular(acceptanceChecksums);
            regular(acceptanceSignature);
            const acceptanceChecksumContents = readStable(acceptanceChecksums);
            verify(acceptanceChecksums, acceptanceSignature, "/.github/workflows/selfhost-acceptance.yml");
            if (!readStable(acceptanceChecksums).equals(acceptanceChecksumContents)) fail("acceptance checksum changed during verification");
            const files = walk(acceptance);
            if (files.length > 10000 || files.reduce((sum, file) => sum + file.size, 0) > maxAcceptance) fail("acceptance evidence exceeds its bounds");
            const expected = files.map((file) => file.relative).filter((name) => !["acceptance-checksums.txt", "acceptance-checksums.bundle.json"].includes(name)).sort();
            const declared = new Map();
            for (const line of acceptanceChecksumContents.toString("utf8").split(/\r?\n/).filter(Boolean)) {
              const match = line.match(/^([a-f0-9]{64})  ([A-Za-z0-9._/-]+)$/);
              if (!match || !portable.test(match[2]) || match[2].split("/").some((part) => part === "." || part === "..") || declared.has(match[2])) fail("acceptance checksum inventory is invalid");
              declared.set(match[2], match[1]);
            }
            if (JSON.stringify([...declared.keys()].sort()) !== JSON.stringify(expected)) fail("acceptance checksum inventory is incomplete");
            for (const [name, digest] of declared) if (await sha256(path.resolve(acceptance, ...name.split("/")), maxAcceptance) !== digest) fail("acceptance checksum mismatch: " + name);
            const acceptanceManifestPath = path.resolve(acceptance, "acceptance-manifest.json");
            const acceptanceManifestContents = readStable(acceptanceManifestPath, maxAcceptance);
            if (crypto.createHash("sha256").update(acceptanceManifestContents).digest("hex") !== declared.get("acceptance-manifest.json")) fail("acceptance manifest checksum mismatch");
            const acceptanceManifest = JSON.parse(acceptanceManifestContents.toString("utf8"));
            if (acceptanceManifest.status !== "passed" || acceptanceManifest.runId !== acceptanceRunId + "-" + acceptanceRunAttempt || acceptanceManifest.workflow?.revision !== revision || acceptanceManifest.releases?.current?.version !== version || acceptanceManifest.releases?.current?.revision !== revision || acceptanceManifest.releases?.current?.archiveSha256 !== checksumMatch[1] || acceptanceManifest.summary?.requiredCells !== 8 || acceptanceManifest.summary?.passedCells !== 8) fail("acceptance manifest does not bind a complete passing release");
            process.stdout.write(JSON.stringify({ ok: true, releaseSha256: checksumMatch[1], acceptanceCells: 8 }) + "\n");
          })().catch((error) => { console.error(error); process.exit(1); });
          NODE

      - name: Check out the authenticated release revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_revision }}
          persist-credentials: false

      - name: Install exact finalization dependencies
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@9.0.0 --activate
          pnpm install --frozen-lockfile

      - name: Validate the frozen v1 and candidate contracts
        run: |
          node scripts/selfhost/verify-v1-contract.mjs
          node scripts/selfhost/verify-release-candidate-workflow.mjs
          node --test scripts/selfhost/*.test.mjs

      - name: Assemble the complete release candidate evidence
        run: >-
          node scripts/selfhost/finalize-release-candidate.mjs
          --release-artifact-directory "${{ runner.temp }}/selfhost-rc-${{ github.run_id }}-${{ github.run_attempt }}/release"
          --acceptance-directory "${{ runner.temp }}/selfhost-rc-${{ github.run_id }}-${{ github.run_attempt }}/acceptance"
          --output-directory "${{ runner.temp }}/selfhost-rc-${{ github.run_id }}-${{ github.run_attempt }}/candidate"
          --candidate-id "${{ inputs.candidate_id }}"
          --workflow-run-id "${{ github.run_id }}"
          --workflow-revision "${{ github.sha }}"
          --workflow-ref "${{ github.workflow_ref }}"
          --release-run-id "${{ inputs.release_run_id }}"
          --release-version "${{ inputs.release_version }}"
          --release-revision "${{ inputs.release_revision }}"
          --acceptance-run-id "${{ inputs.acceptance_run_id }}"
          --acceptance-run-attempt "${{ inputs.acceptance_run_attempt }}"
          --attestation-file "${{ runner.temp }}/selfhost-rc-${{ github.run_id }}-${{ github.run_attempt }}/release-attestation.input.json"

      - name: Sign the complete candidate inventory
        run: cosign sign-blob --yes --bundle "${{ runner.temp }}/selfhost-rc-${{ github.run_id }}-${{ github.run_attempt }}/candidate/release-candidate-checksums.bundle.json" "${{ runner.temp }}/selfhost-rc-${{ github.run_id }}-${{ github.run_attempt }}/candidate/release-candidate-checksums.txt"

      - name: Verify the candidate signature
        run: cosign verify-blob --bundle "${{ runner.temp }}/selfhost-rc-${{ github.run_id }}-${{ github.run_attempt }}/candidate/release-candidate-checksums.bundle.json" --certificate-identity "https://github.com/${GITHUB_WORKFLOW_REF}" --certificate-oidc-issuer "https://token.actions.githubusercontent.com" "${{ runner.temp }}/selfhost-rc-${{ github.run_id }}-${{ github.run_attempt }}/candidate/release-candidate-checksums.txt"

      - name: Verify the complete release candidate
        run: >-
          pnpm selfhost:release-candidate-verify
          --candidate-directory "${{ runner.temp }}/selfhost-rc-${{ github.run_id }}-${{ github.run_attempt }}/candidate"
          --release-version "${{ inputs.release_version }}"
          --release-revision "${{ inputs.release_revision }}"
          --json

      - name: Upload the immutable release candidate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trainingload-selfhost-rc-${{ inputs.release_version }}-${{ inputs.candidate_id }}
          path: ${{ runner.temp }}/selfhost-rc-${{ github.run_id }}-${{ github.run_attempt }}/candidate
          if-no-files-found: error
          retention-days: 90

      - name: Remove test-owned candidate workspace
        if: ${{ always() }}
        env:
          RC_ROOT: ${{ runner.temp }}/selfhost-rc-${{ github.run_id }}-${{ github.run_attempt }}
          RC_PREFIX: selfhost-rc-${{ github.run_id }}-${{ github.run_attempt }}
        run: >-
          node -e '
          const fs = require("node:fs");
          const path = require("node:path");
          const root = path.resolve(process.env.RC_ROOT);
          const temporaryRoot = path.resolve(process.env.RUNNER_TEMP);
          if (path.dirname(root) !== temporaryRoot || path.basename(root) !== process.env.RC_PREFIX) {
            throw new Error("refusing to remove an unowned release candidate path");
          }
          fs.rmSync(root, { recursive: true, force: true });
          '
