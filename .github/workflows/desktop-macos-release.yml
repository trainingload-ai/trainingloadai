name: Desktop macOS signed release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-macos-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main' && github.event.repository.private == false
    runs-on: macos-15
    timeout-minutes: 120
    environment: desktop-macos-release
    permissions:
      contents: write
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_BUILD_CPUS: "2"
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/trainingload
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22.23.3
      - name: Require the trusted public main branch and standard arm64 Mac runner
        run: node apps/desktop/scripts/macos-ci-credentials.mjs check-context
      - run: corepack enable && corepack prepare pnpm@9.0.0 --activate
      - run: pnpm install --frozen-lockfile
      - name: Build and test before importing signing credentials
        run: |
          pnpm desktop:build
          pnpm --dir apps/desktop test
          pnpm --dir apps/desktop core:check
      - name: Import credentials into a temporary runner Keychain
        env:
          DESKTOP_MAC_P12_BASE64: ${{ secrets.DESKTOP_MAC_P12_BASE64 }}
          DESKTOP_MAC_P12_PASSWORD: ${{ secrets.DESKTOP_MAC_P12_PASSWORD }}
          DESKTOP_MAC_APPLE_ID: ${{ secrets.DESKTOP_MAC_APPLE_ID }}
          DESKTOP_MAC_APP_PASSWORD: ${{ secrets.DESKTOP_MAC_APP_PASSWORD }}
          DESKTOP_MAC_TEAM_ID: ${{ secrets.DESKTOP_MAC_TEAM_ID }}
        run: node apps/desktop/scripts/macos-ci-credentials.mjs import
      - name: Sign, notarize, staple and verify DMG and ZIP
        run: pnpm --dir apps/desktop dist:mac:signed
      - name: Save verified installers to a draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node apps/desktop/scripts/macos-cloud-publish.mjs
      - name: Retain small verification and notarization reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: desktop-macos-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 1
          if-no-files-found: ignore
          include-hidden-files: true
          path: |
            apps/desktop/build/release-signed/*/release.json
            apps/desktop/build/release-signed/*/notarization.json
            apps/desktop/build/.signed-macos-*/notarization.json
      - name: Remove temporary Keychain and encrypted certificate file
        if: always()
        run: node apps/desktop/scripts/macos-ci-credentials.mjs cleanup
